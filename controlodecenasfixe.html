<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Universal de Periféricos & Routers</title>
    <style>
        :root {
            --bg-main: #0c0c0e;
            --bg-card: #16161a;
            --border: #24242b;
            --accent: #0078d7;
            --text-main: #f1f1f4;
            --text-sub: #9696a0;
            --status-green: #06b6d4;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-title {
            text-align: center;
            margin-bottom: 32px;
        }

        .dashboard-title h1 { margin: 0 0 8px 0; font-size: 32px; letter-spacing: -0.5px; }
        .dashboard-title p { color: var(--text-sub); margin: 0; }

        .layout-grid {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .panel-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .panel-header h2 { margin: 0; font-size: 20px; font-weight: 600; }
        
        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; font-weight: 500; }
        select, input, textarea {
            background-color: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }
        
        textarea { height: 70px; resize: none; font-family: monospace; font-size: 12px; }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover { background-color: #005a9e; transform: translateY(-1px); }
        button.secondary { background-color: #24242b; border: 1px solid var(--border); }
        button.secondary:hover { background-color: #2f2f38; }

        #terminal-output {
            background-color: #040405;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #8ed0f9;
            height: 160px;
            overflow-y: auto;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="dashboard-title">
        <h1>🎛️ Painel de Controlo de Rede e Hardware</h1>
        <p>Gestão Universal P2P, Qualquer Router & Periféricos Remotos</p>
    </div>

    <div class="layout-grid">
        
        <!-- MÓDULO 1: SINCRONIZAÇÃO DA MALHA LOCAL -->
        <div class="panel-card">
            <div class="panel-header">
                <h2>🔗 Link de Sincronização Local (WebRTC)</h2>
            </div>
            <div class="row-inputs">
                <div>
                    <label>Ação Inicial:</label>
                    <button class="secondary" onclick="iniciarMalhaP2P()">1. Gerar Link de Pareamento</button>
                </div>
                <div>
                    <label>Dados de Sinalização de Dispositivos:</label>
                    <textarea id="p2pToken" placeholder="Cole o token do dispositivo remoto para fechar o túnel local..."></textarea>
                </div>
            </div>
            <button onclick="conectarMalhaP2P()">2. Confirmar Conexão Direta</button>
        </div>

        <!-- MÓDULO 2: QUALQUER ROUTER -->
        <div class="panel-card">
            <div class="panel-header">
                <h2>📡 Comandos de Infraestrutura (Qualquer Router)</h2>
            </div>
            <div class="row-inputs">
                <div>
                    <label>IP Gateway do Router Target:</label>
                    <input type="text" id="routerIp" value="192.168.1.1">
                </div>
                <div>
                    <label>Perfil Wi-Fi do Computador Alvo:</label>
                    <select id="wifiProfile">
                        <option value="Router_LivingRoom_5G">Router Principal 5GHz</option>
                        <option value="Router_Office_Asus">Router Asus Backup</option>
                        <option value="Router_IoT_Isolated">VLAN Isolada (Dispositivos IoT)</option>
                    </select>
                </div>
            </div>
            <div class="btn-group">
                <button onclick="enviarSinalRede('MUDAR_WIFI')">Trocar SSID Alvo</button>
                <button class="secondary" onclick="executarUPnPRouter()">Mapear Porta (UPnP)</button>
            </div>
        </div>

        <!-- MÓDULO 3: QUALQUER PERIFÉRICO -->
        <div class="panel-card">
            <div class="panel-header">
                <h2>⌨️ Controlo Global de Periféricos (DESKTOP-U2S2O7P)</h2>
            </div>
            <label>Ações Rápidas de Hardware sobre o Sistema Operativo:</label>
            <div class="btn-group">
                <button class="secondary" onclick="enviarSinalRede('VOL_UP')">🔊 Volume +</button>
                <button class="secondary" onclick="enviarSinalRede('VOL_DOWN')">🔉 Volume -</button>
                <button class="secondary" onclick="enviarSinalRede('MUTAR')">🔇 Mute</button>
                <button class="secondary" onclick="enviarSinalRede('MONITOR_OFF')">🖥️ Ecrã Off</button>
            </div>
        </div>

        <!-- TERMINAL DE OUTPUT -->
        <div id="terminal-output">>> Aguardando comandos ou tráfego de rede local...</div>
    </div>

    <script>
        let rtcConnection;
        let rtcChannel;
        const iceConfiguration = { iceServers: [{ urls: "stun:://google.com" }] };

        function printLog(text) {
            const out = document.getElementById('terminal-output');
            out.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${text}`;
            out.scrollTop = out.scrollHeight;
        }

        // --- WEB SYNC (WEBRTC) P2P ENGINE ---
        async function iniciarMalhaP2P() {
            rtcConnection = new RTCPeerConnection(iceConfiguration);
            atribuirEventosAoCanal(rtcConnection.createDataChannel("universalBridge"));
            
            rtcConnection.onicecandidate = ev => {
                if (!ev.candidate) {
                    document.getElementById("p2pToken").value = JSON.stringify(rtcConnection.localDescription);
                    printLog("📋 Token de pareamento gerado! Envie-o para o outro ecrã.");
                }
            };
            const offer = await rtcConnection.createOffer();
            await rtcConnection.setLocalDescription(offer);
        }

        async function conectarMalhaP2P() {
            const rawToken = document.getElementById("p2pToken").value.trim();
            if (!rawToken) return alert("Insira o token de rede gerado.");
            const parsedSdp = JSON.parse(rawToken);

            if (!rtcConnection) {
                rtcConnection = new RTCPeerConnection(iceConfiguration);
                rtcConnection.ondatachannel = ev => atribuirEventosAoCanal(ev.channel);
                
                rtcConnection.onicecandidate = ev => {
                    if (!ev.candidate) {
                        document.getElementById("p2pToken").value = JSON.stringify(rtcConnection.localDescription);
                        printLog("📋 Resposta de sincronismo gerada. Copie-a de volta para o dispositivo inicial.");
                    }
                };
                await rtcConnection.setRemoteDescription(parsedSdp);
                const answer = await rtcConnection.createAnswer();
                await rtcConnection.setLocalDescription(answer);
            } else {
                await rtcConnection.setRemoteDescription(parsedSdp);
            }
        }

        function atribuirEventosAoCanal(channel) {
            rtcChannel = channel;
            rtcChannel.onopen = () => printLog("🟢 Canal WebRTC ativo. Controlo de hardware desbloqueado.");
            rtcChannel.onmessage = (msg) => {
                const pacote = JSON.parse(msg.data);
                printLog(`📥 Comando Remoto Intercetado: [${pacote.tipo}] -> Executando na máquina local.`);
                
                if (pacote.tipo === 'MUDAR_WIFI') {
                    document.getElementById('wifiProfile').value = pacote.payload;
                    executarShellNativa(`netsh wlan connect name="${pacote.payload}"`);
                } else {
                    processarPerifericoLocal(pacote.tipo);
                }
            };
        }
